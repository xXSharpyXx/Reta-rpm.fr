include ':app'
include ':capacitor-cordova-android-plugins'
project(':capacitor-cordova-android-plugins').projectDir = new File('./capacitor-cordova-android-plugins/')
// The Wear OS watch app (wear/build.gradle, docs/WEAR_OS.md). Here and not in
// capacitor.settings.gradle, which `cap sync` writes again each time. `-PnoWear` leaves it out
// altogether, so the phone APK builds exactly as before whatever happens in the watch module
// (.github/workflows/android-apk.yml builds the phone that way).
if (!providers.gradleProperty('noWear').isPresent()) {
    include ':wear'
}

apply from: 'capacitor.settings.gradle'
// The Play asset packs of the animations, only while the release machine builds the Play bundle
// (scripts/android/make-asset-packs.mjs writes this file and the modules; never committed).
if (file('asset-packs.settings.gradle').exists()) {
    apply from: 'asset-packs.settings.gradle'
}
